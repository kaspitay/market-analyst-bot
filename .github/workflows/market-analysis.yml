name: Market Analysis

on:
  schedule:
    # 02:00 UTC — daily, and the only scheduled run. GitHub starts scheduled runs
    # 3-7h late (11h at worst, measured Aug-Oct 2026), so 02:00 lands 05:00-13:00
    # UTC: always before the US open (13:30 UTC), when every daily candle is
    # complete. At 11:30 UTC the delayed run landed mid-session and scored a
    # still-forming candle, which moved combined_score more at the median (0.60)
    # than a whole overnight session did (0.20) — monitor mode reports that as news.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      briefing_type:
        description: "Briefing type"
        required: false
        default: "pre-market"
        type: choice
        options:
          - pre-market
          - pre-close

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Never derive the type from the clock: scheduled runs start hours late, and
      # `pre-market` is what unlocks the Sunday full briefing. `inputs.*` is empty
      # on a schedule event, so the cron run is always pre-market.
      - name: Determine briefing type
        id: briefing
        run: echo "type=${{ inputs.briefing_type || 'pre-market' }}" >> $GITHUB_OUTPUT

      - name: Run analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python analyzer.py ${{ steps.briefing.outputs.type }}

      - name: Commit dashboard data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/market-data.json docs/data/briefings.jsonl
          git diff --cached --quiet || git commit -m "Update dashboard data: ${{ steps.briefing.outputs.type }} $(date -u +%Y-%m-%d)"
          git push
